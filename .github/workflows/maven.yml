name: Run test

on:
  push

jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Chrome and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver xvfb
          sudo ln -s /usr/bin/chromedriver /usr/local/bin/chromedriver

      - name: Run tests
        uses: GabrielBB/xvfb-action@v1
        with:
          run: |
            mvn clean test
              -Dwebdriver.chrome.driver=/usr/bin/chromedriver
              -Dchrome.binary=/usr/bin/chromium-browser
              -Dchrome.headless=true
          continue-on-error: false

      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          gh_pages: gh-pages
          allure_report: target/allure-report
          allure_history: target/allure-history

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/allure-history